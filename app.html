<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>iNet · Connect</title>
    
    <!-- PWA Meta -->
    <meta name="theme-color" content="#e63946">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="iNet">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        :root {
            --bg: #0e0e10;
            --surface: #18181c;
            --surface2: #222228;
            --border: rgba(255,255,255,0.07);
            --accent: #e63946;
            --accent-dim: rgba(230,57,70,0.1);
            --green: #2ecc71;
            --yellow: #f4b942;
            --text: #f0f0f2;
            --text-muted: #8e8e98;
            --muted: #6b6b75;
            --radius: 16px;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }
        
        html, body {
            height: 100%;
            width: 100%;
            position: fixed;
            overflow: hidden;
        }
        
        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        /* SVG Icons */
        .icon {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }
        
        /* Header */
        .header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: calc(var(--safe-top) + 8px) 16px 8px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }
        
        .logo {
            width: 34px;
            height: 34px;
            background: var(--accent);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'DM Mono', monospace;
            font-weight: 500;
            color: white;
        }
        
        .app-name {
            font-weight: 600;
            font-size: 1rem;
            flex: 1;
        }
        
        .pin-badge {
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--text-muted);
            font-family: 'DM Mono', monospace;
            font-size: 0.75rem;
            padding: 5px 10px;
            border-radius: 20px;
            letter-spacing: 2px;
        }
        
        .pin-badge.active {
            color: var(--text);
            border-color: var(--accent);
        }
        
        .connection-status {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--muted);
        }
        
        .connection-status.connected { background: var(--green); }
        .connection-status.connecting { background: var(--yellow); }
        
        #installButton {
            background: var(--accent);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
        }
        
        /* Tabs */
        .tabs {
            display: flex;
            border-bottom: 1px solid var(--border);
            background: var(--surface);
            flex-shrink: 0;
        }
        
        .tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            color: var(--muted);
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        
        .tab.active {
            color: var(--accent);
            border-bottom: 2px solid var(--accent);
        }
        
        .tab svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }
        
        /* Main Container */
        .main-container {
            flex: 1;
            overflow: hidden;
            position: relative;
        }
        
        /* Views */
        .view {
            height: 100%;
            overflow-y: auto;
            padding: 16px;
            padding-bottom: calc(80px + var(--safe-bottom));
            display: none;
            -webkit-overflow-scrolling: touch;
        }
        
        .view.active { display: block; }
        
        /* Items */
        .item {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }
        
        .item:active { background: var(--surface2); }
        
        .item-avatar {
            width: 48px;
            height: 48px;
            background: var(--surface2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'DM Mono', monospace;
            font-size: 1.2rem;
            color: var(--text-muted);
            flex-shrink: 0;
        }
        
        .item-info {
            flex: 1;
            min-width: 0;
        }
        
        .item-name {
            font-weight: 600;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .item-detail {
            font-size: 0.8rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--muted);
            flex-shrink: 0;
        }
        
        .status-dot.online { background: var(--green); }
        
        .item-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }
        
        .item-time {
            font-size: 0.7rem;
            color: var(--muted);
        }
        
        .badge {
            background: var(--yellow);
            color: black;
            border-radius: 20px;
            padding: 2px 8px;
            font-size: 0.7rem;
            font-weight: 600;
        }
        
        /* FAB */
        .fab {
            position: fixed;
            bottom: calc(20px + var(--safe-bottom));
            right: 20px;
            width: 56px;
            height: 56px;
            background: var(--accent);
            border: none;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(230,57,70,0.4);
            z-index: 100;
        }
        
        .fab svg {
            width: 24px;
            height: 24px;
            fill: white;
        }
        
        /* Modal */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1500;
            padding: 16px;
        }
        
        .modal.show { display: flex; }
        
        .modal-content {
            background: var(--surface);
            border-radius: 24px;
            padding: 24px;
            width: 100%;
            max-width: 340px;
            border: 1px solid var(--border);
        }
        
        .modal-title {
            font-weight: 600;
            font-size: 1.2rem;
            margin-bottom: 20px;
        }
        
        .modal-input {
            width: 100%;
            padding: 14px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font-family: 'DM Mono', monospace;
            font-size: 1.2rem;
            text-align: center;
            letter-spacing: 4px;
            margin-bottom: 16px;
        }
        
        .modal-buttons {
            display: flex;
            gap: 8px;
        }
        
        .modal-btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
        }
        
        .modal-btn.primary {
            background: var(--accent);
            color: white;
        }
        
        .modal-btn.secondary {
            background: var(--surface2);
            color: var(--text-muted);
        }
        
        /* Chat View */
        .chat-view {
            position: fixed;
            inset: 0;
            background: var(--bg);
            display: none;
            flex-direction: column;
            z-index: 1000;
        }
        
        .chat-view.show { display: flex; }
        
        .chat-header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: calc(var(--safe-top) + 8px) 16px 8px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }
        
        .chat-back {
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        
        .chat-back svg {
            width: 20px;
            height: 20px;
            fill: var(--text-muted);
        }
        
        .chat-info {
            flex: 1;
        }
        
        .chat-name {
            font-weight: 600;
        }
        
        .chat-status {
            font-size: 0.7rem;
            color: var(--text-muted);
        }
        
        .chat-actions {
            display: flex;
            gap: 8px;
        }
        
        .action-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        
        .action-btn.audio {
            background: var(--green);
        }
        
        .action-btn.video {
            background: var(--accent);
        }
        
        .action-btn svg {
            width: 18px;
            height: 18px;
            fill: white;
        }
        
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            -webkit-overflow-scrolling: touch;
        }
        
        .message {
            max-width: 80%;
            align-self: flex-start;
        }
        
        .message.own {
            align-self: flex-end;
        }
        
        .message-bubble {
            background: var(--surface2);
            padding: 10px 14px;
            border-radius: 18px;
            border: 1px solid var(--border);
            word-break: break-word;
            font-size: 0.9rem;
        }
        
        .message.own .message-bubble {
            background: var(--accent);
            border-color: var(--accent);
        }
        
        .message-media {
            max-width: 200px;
            max-height: 200px;
            border-radius: 12px;
            cursor: pointer;
        }
        
        .message-audio {
            width: 200px;
            height: 40px;
        }
        
        .message-meta {
            font-size: 0.65rem;
            color: var(--muted);
            margin-top: 4px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 4px;
        }
        
        .message-status.pending {
            color: var(--yellow);
        }
        
        .chat-input-area {
            background: var(--surface);
            border-top: 1px solid var(--border);
            padding: 12px 16px calc(12px + var(--safe-bottom));
            display: flex;
            gap: 8px;
            flex-shrink: 0;
            align-items: center;
        }
        
        .attach-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--surface2);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
        }
        
        .attach-btn svg {
            width: 20px;
            height: 20px;
            fill: var(--text-muted);
        }
        
        .voice-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--surface2);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
        }
        
        .voice-btn.recording {
            background: var(--accent);
            animation: pulse 1s infinite;
        }
        
        .voice-btn svg {
            width: 20px;
            height: 20px;
            fill: var(--text-muted);
        }
        
        .voice-btn.recording svg {
            fill: white;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        
        .chat-input {
            flex: 1;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 12px 16px;
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
        }
        
        .chat-input:focus {
            outline: none;
            border-color: var(--accent);
        }
        
        .send-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--accent);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
        }
        
        .send-btn svg {
            width: 18px;
            height: 18px;
            fill: white;
        }
        
        /* Call Screen */
        .call-screen {
            position: fixed;
            inset: 0;
            background: #000;
            display: none;
            flex-direction: column;
            z-index: 2000;
        }
        
        .call-screen.show { display: flex; }
        
        .call-video-area {
            flex: 1;
            background: #0a0a0c;
            position: relative;
        }
        
        #remoteVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        #localVideo {
            position: absolute;
            bottom: 100px;
            right: 16px;
            width: 90px;
            height: 120px;
            border-radius: 12px;
            border: 2px solid rgba(255,255,255,0.2);
            object-fit: cover;
            background: #1a1a1e;
        }
        
        .call-status-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            z-index: 10;
        }
        
        .call-status-text {
            font-size: 1.5rem;
            margin-bottom: 8px;
        }
        
        .call-subtext {
            color: var(--text-muted);
        }
        
        .call-controls {
            padding: 20px 16px calc(20px + var(--safe-bottom));
            display: flex;
            justify-content: center;
            gap: 20px;
            background: linear-gradient(transparent, #000);
        }
        
        .call-btn {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        
        .call-btn.end {
            background: var(--accent);
        }
        
        .call-btn.mute {
            background: var(--surface2);
        }
        
        .call-btn svg {
            width: 24px;
            height: 24px;
            fill: white;
        }
        
        /* Empty States */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }
        
        .empty-icon {
            width: 60px;
            height: 60px;
            background: var(--surface2);
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
        }
        
        .empty-icon svg {
            width: 30px;
            height: 30px;
            fill: var(--muted);
        }
        
        /* Toast */
        .toast {
            position: fixed;
            bottom: calc(100px + var(--safe-bottom));
            left: 50%;
            transform: translateX(-50%);
            background: rgba(22,22,26,0.95);
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 0.85rem;
            z-index: 3000;
            border: 1px solid var(--border);
            backdrop-filter: blur(4px);
            white-space: nowrap;
            max-width: 90%;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="logo">iN</div>
        <div class="app-name">iNet</div>
        <div class="connection-status" id="connectionStatus"></div>
        <div class="pin-badge" id="pinDisplay">--</div>
        <button id="installButton" onclick="installApp()">Install</button>
    </div>

    <!-- Tabs -->
    <div class="tabs" id="tabs" style="display: none;">
        <div class="tab active" onclick="switchTab('contacts')">
            <svg viewBox="0 0 24 24">
                <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
            </svg>
            Contacts
        </div>
        <div class="tab" onclick="switchTab('chats')">
            <svg viewBox="0 0 24 24">
                <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/>
            </svg>
            Chats
        </div>
        <div class="tab" onclick="switchTab('calls')">
            <svg viewBox="0 0 24 24">
                <path d="M20 15.5c-1.2 0-2.4-.2-3.6-.6-.3-.1-.7 0-1 .2l-2.2 2.2c-2.8-1.4-5.1-3.8-6.6-6.6l2.2-2.2c.3-.3.4-.7.2-1-.3-1.1-.5-2.3-.5-3.5 0-.6-.4-1-1-1H4c-.6 0-1 .4-1 1 0 9.4 7.6 17 17 17 .6 0 1-.4 1-1v-3.5c0-.6-.4-1-1-1z"/>
            </svg>
            Calls
        </div>
    </div>

    <!-- Main Container -->
    <div class="main-container">
        <!-- Signup View -->
        <div class="view active" id="signupView">
            <div style="height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 24px; text-align: center;">
                <div class="logo" style="width: 90px; height: 90px; border-radius: 24px; font-size: 2rem; margin-bottom: 28px;">iN</div>
                <h2 style="margin-bottom: 10px;">iNet</h2>
                <p style="color: var(--text-muted); margin-bottom: 36px; max-width: 260px;">Private peer-to-peer calls. No servers after connection.</p>
                <button class="modal-btn primary" style="padding: 16px 40px; border-radius: 30px; width: auto;" onclick="signup()">Get your PIN</button>
                <div id="signupError" style="color: var(--accent); margin-top: 14px;"></div>
            </div>
        </div>

        <!-- Contacts View -->
        <div class="view" id="contactsView">
            <div id="contactsList"></div>
            <div id="contactsEmpty" class="empty-state" style="display: none;">
                <div class="empty-icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                    </svg>
                </div>
                <div>No contacts yet</div>
                <div style="font-size: 0.8rem; margin-top: 8px;">Tap + to add by PIN</div>
            </div>
        </div>

        <!-- Chats View -->
        <div class="view" id="chatsView">
            <div id="chatsList"></div>
            <div id="chatsEmpty" class="empty-state" style="display: none;">
                <div class="empty-icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/>
                    </svg>
                </div>
                <div>No chats yet</div>
            </div>
        </div>

        <!-- Calls View -->
        <div class="view" id="callsView">
            <div id="callsList"></div>
            <div id="callsEmpty" class="empty-state" style="display: none;">
                <div class="empty-icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M20 15.5c-1.2 0-2.4-.2-3.6-.6-.3-.1-.7 0-1 .2l-2.2 2.2c-2.8-1.4-5.1-3.8-6.6-6.6l2.2-2.2c.3-.3.4-.7.2-1-.3-1.1-.5-2.3-.5-3.5 0-.6-.4-1-1-1H4c-.6 0-1 .4-1 1 0 9.4 7.6 17 17 17 .6 0 1-.4 1-1v-3.5c0-.6-.4-1-1-1z"/>
                    </svg>
                </div>
                <div>No calls yet</div>
            </div>
        </div>
    </div>

    <!-- FAB -->
    <button class="fab" id="fab" onclick="showAddContactModal()">
        <svg viewBox="0 0 24 24">
            <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
        </svg>
    </button>

    <!-- Add Contact Modal -->
    <div class="modal" id="addContactModal" onclick="if(event.target===this) hideModal()">
        <div class="modal-content">
            <div class="modal-title">Add Contact</div>
            <input type="text" class="modal-input" id="contactPin" maxlength="6" placeholder="------" oninput="this.value=this.value.replace(/[^0-9]/g,'')">
            <div class="modal-buttons">
                <button class="modal-btn primary" onclick="addContact()">Add</button>
                <button class="modal-btn secondary" onclick="hideModal()">Cancel</button>
            </div>
        </div>
    </div>

    <!-- File Input (hidden) -->
    <input type="file" id="fileInput" style="display: none;" accept="image/*,video/*,audio/*">

    <!-- Chat View -->
    <div class="chat-view" id="chatView">
        <div class="chat-header">
            <div class="chat-back" onclick="closeChat()">
                <svg viewBox="0 0 24 24">
                    <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
                </svg>
            </div>
            <div class="chat-info">
                <div class="chat-name" id="chatContactName"></div>
                <div class="chat-status" id="chatContactStatus"></div>
            </div>
            <div class="chat-actions">
                <button class="action-btn audio" onclick="startCall('audio')">
                    <svg viewBox="0 0 24 24">
                        <path d="M20 15.5c-1.2 0-2.4-.2-3.6-.6-.3-.1-.7 0-1 .2l-2.2 2.2c-2.8-1.4-5.1-3.8-6.6-6.6l2.2-2.2c.3-.3.4-.7.2-1-.3-1.1-.5-2.3-.5-3.5 0-.6-.4-1-1-1H4c-.6 0-1 .4-1 1 0 9.4 7.6 17 17 17 .6 0 1-.4 1-1v-3.5c0-.6-.4-1-1-1z"/>
                    </svg>
                </button>
                <button class="action-btn video" onclick="startCall('video')">
                    <svg viewBox="0 0 24 24">
                        <path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/>
                    </svg>
                </button>
            </div>
        </div>
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-input-area">
            <button class="attach-btn" onclick="document.getElementById('fileInput').click()">
                <svg viewBox="0 0 24 24">
                    <path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5c0-1.38 1.12-2.5 2.5-2.5s2.5 1.12 2.5 2.5v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-1.5z"/>
                </svg>
            </button>
            <button class="voice-btn" id="voiceBtn" onclick="toggleVoiceRecording()">
                <svg viewBox="0 0 24 24">
                    <path d="M12 14c1.66 0 2.99-1.34 2.99-3L15 5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.49 6-3.31 6-6.72h-1.7z"/>
                </svg>
            </button>
            <input type="text" class="chat-input" id="messageInput" placeholder="Message..." onkeypress="if(event.key==='Enter') sendMessage()">
            <button class="send-btn" onclick="sendMessage()">
                <svg viewBox="0 0 24 24">
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                </svg>
            </button>
        </div>
    </div>

    <!-- Call Screen -->
    <div class="call-screen" id="callScreen">
        <div class="call-video-area">
            <video id="remoteVideo" autoplay playsinline></video>
            <video id="localVideo" autoplay playsinline muted></video>
            <div class="call-status-overlay" id="callStatusOverlay">
                <div class="call-status-text" id="callStatusText">Calling...</div>
                <div class="call-subtext" id="callSubtext"></div>
            </div>
        </div>
        <div class="call-controls">
            <button class="call-btn mute" id="muteBtn" onclick="toggleMute()">
                <svg viewBox="0 0 24 24">
                    <path d="M3 9v6h4l5 5V4L7 9H3z"/>
                </svg>
            </button>
            <button class="call-btn end" onclick="endCall()">
                <svg viewBox="0 0 24 24">
                    <path d="M12 2C6.47 2 2 6.47 2 12s4.47 10 10 10 10-4.47 10-10S17.53 2 12 2zm5 13.59L15.59 17 12 13.41 8.41 17 7 15.59 10.59 12 7 8.41 8.41 7 12 10.59 15.59 7 17 8.41 13.41 12 17 15.59z"/>
                </svg>
            </button>
            <button class="call-btn mute" onclick="toggleSpeaker()">
                <svg viewBox="0 0 24 24">
                    <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                </svg>
            </button>
        </div>
    </div>

    <audio id="remoteAudio" autoplay></audio>

    <script>
        // ===== CONFIG =====
        const API_BASE = 'https://emltechstudio-inet.hf.space';
        const WS_URL = 'wss://emltechstudio-inet.hf.space/ws';
        
        // ===== STATE =====
        let myPin = localStorage.getItem('myPin');
        let deviceId = localStorage.getItem('deviceId');
        let vapidKey = localStorage.getItem('vapidKey');
        let ws = null;
        let wsReconnectTimer = null;
        
        // Data stores
        let contacts = JSON.parse(localStorage.getItem('contacts') || '[]');
        let chats = JSON.parse(localStorage.getItem('chats') || '{}');
        let calls = JSON.parse(localStorage.getItem('calls') || '[]');
        let pending = JSON.parse(localStorage.getItem('pending') || '{}');
        
        // UI State
        let currentChat = null;
        let onlineStatus = {};
        let syncInterval = null;
        let deferredPrompt = null;
        let localStream = null;
        let peerConnections = {};
        let callTimeout = null;
        let isCallActive = false;
        
        // Voice Recording
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;

        // ===== INIT =====
        (function init() {
            if (!myPin) {
                document.getElementById('signupView').classList.add('active');
            } else {
                initializeApp();
            }
            
            setupPWAInstall();
            setupFileInput();
        })();

        function initializeApp() {
            document.getElementById('signupView').classList.remove('active');
            document.getElementById('tabs').style.display = 'flex';
            document.getElementById('pinDisplay').textContent = myPin;
            document.getElementById('pinDisplay').classList.add('active');
            
            connectWebSocket();
            renderContacts();
            renderChats();
            renderCalls();
            startSyncEngine();
            registerServiceWorker();
        }

        // ===== PWA INSTALL =====
        function setupPWAInstall() {
            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault();
                deferredPrompt = e;
                document.getElementById('installButton').style.display = 'block';
            });

            window.addEventListener('appinstalled', () => {
                deferredPrompt = null;
                document.getElementById('installButton').style.display = 'none';
                toast('App installed successfully!');
            });
            
            // Check if already installed
            const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
            if (isStandalone) {
                document.getElementById('installButton').style.display = 'none';
            }
        }

        function installApp() {
            if (!deferredPrompt) {
                toast('App already installed or not installable');
                return;
            }
            
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then((choiceResult) => {
                if (choiceResult.outcome === 'accepted') {
                    console.log('User accepted install');
                }
                deferredPrompt = null;
            });
        }

        // ===== SIGNUP =====
        async function signup() {
            const btn = event.target;
            btn.disabled = true;
            btn.textContent = 'Creating...';

            try {
                const res = await fetch(API_BASE + '/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ device_info: {} })
                });
                const data = await res.json();

                if (data.net_number) {
                    myPin = data.net_number;
                    deviceId = data.device_id;
                    vapidKey = data.vapid_public_key;

                    localStorage.setItem('myPin', myPin);
                    localStorage.setItem('deviceId', deviceId);
                    if (vapidKey) localStorage.setItem('vapidKey', vapidKey);

                    initializeApp();
                    subscribePush();
                } else {
                    throw new Error('Signup failed');
                }
            } catch (err) {
                document.getElementById('signupError').textContent = err.message;
            } finally {
                btn.disabled = false;
                btn.textContent = 'Get your PIN';
            }
        }

        // ===== SERVICE WORKER =====
        async function registerServiceWorker() {
            if ('serviceWorker' in navigator) {
                try {
                    await navigator.serviceWorker.register('sw.js');
                } catch (err) {
                    console.warn('SW failed:', err);
                }
            }
        }

        // ===== WEBSOCKET =====
        function connectWebSocket() {
            if (!myPin || !deviceId) return;
            if (ws?.readyState === WebSocket.OPEN) return;

            const status = document.getElementById('connectionStatus');
            status.className = 'connection-status connecting';

            try {
                ws = new WebSocket(`${WS_URL}?net_number=${myPin}&device_id=${deviceId}`);

                ws.onopen = () => {
                    status.className = 'connection-status connected';
                    if (wsReconnectTimer) {
                        clearTimeout(wsReconnectTimer);
                        wsReconnectTimer = null;
                    }
                };

                ws.onmessage = (e) => {
                    try {
                        const msg = JSON.parse(e.data);
                        handleSignalingMessage(msg);
                    } catch (err) {}
                };

                ws.onclose = () => {
                    status.className = 'connection-status';
                    scheduleReconnect();
                };

                ws.onerror = () => {
                    status.className = 'connection-status';
                };
            } catch (err) {
                scheduleReconnect();
            }
        }

        function scheduleReconnect() {
            if (wsReconnectTimer) return;
            wsReconnectTimer = setTimeout(() => {
                wsReconnectTimer = null;
                connectWebSocket();
            }, 3000);
        }

        function signal(target, type, payload) {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                toast('Not connected');
                return;
            }
            ws.send(JSON.stringify({ target, type, payload }));
        }

        // ===== PUSH =====
        async function subscribePush() {
            if (!vapidKey || !('serviceWorker' in navigator) || !('PushManager' in window)) return;

            try {
                const reg = await navigator.serviceWorker.ready;
                const sub = await reg.pushManager.subscribe({
                    userVisibleOnly: true,
                    applicationServerKey: urlBase64ToUint8Array(vapidKey)
                });

                await fetch(API_BASE + '/push/subscribe', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        net_number: myPin,
                        device_id: deviceId,
                        subscription: sub.toJSON()
                    })
                });
            } catch (err) {
                console.warn('Push failed:', err);
            }
        }

        function urlBase64ToUint8Array(base64String) {
            const padding = '='.repeat((4 - base64String.length % 4) % 4);
            const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
            const rawData = window.atob(base64);
            return Uint8Array.from([...rawData].map(char => char.charCodeAt(0)));
        }

        // ===== SYNC ENGINE =====
        function startSyncEngine() {
            if (syncInterval) clearInterval(syncInterval);
            syncInterval = setInterval(syncWithContacts, 30000);
        }

        async function syncWithContacts() {
            if (!navigator.onLine) return;
            
            for (let contact of contacts) {
                const status = await checkOnlineStatus(contact.pin);
                onlineStatus[contact.pin] = status;
                
                if (status.online) {
                    const pendingMsgs = pending[contact.pin];
                    if (pendingMsgs?.length) {
                        signal(contact.pin, 'sync_deliver', { messages: pendingMsgs });
                        delete pending[contact.pin];
                        localStorage.setItem('pending', JSON.stringify(pending));
                    }
                    
                    signal(contact.pin, 'sync_request', { from: myPin });
                }
            }
            
            renderContacts();
            renderChats();
        }

        async function checkOnlineStatus(pin) {
            try {
                const res = await fetch(`${API_BASE}/status/${pin}`);
                return await res.json();
            } catch {
                return { online: false };
            }
        }

        // ===== SIGNALING HANDLER =====
        function handleSignalingMessage(msg) {
            const { from, type, payload } = msg;

            switch (type) {
                case 'chat':
                    receiveMessage(from, payload);
                    break;
                case 'sync_request':
                    handleSyncRequest(from);
                    break;
                case 'sync_deliver':
                    handleSyncDeliver(from, payload);
                    break;
                case 'call_offer':
                    handleCallOffer(from, payload);
                    break;
                case 'call_answer':
                    handleCallAnswer(from, payload);
                    break;
                case 'ice_candidate':
                    handleIceCandidate(from, payload);
                    break;
                case 'call_end':
                    handleCallEnd(from);
                    break;
            }
        }

        function handleSyncRequest(from) {
            const pendingMsgs = pending[from];
            if (pendingMsgs?.length) {
                signal(from, 'sync_deliver', { messages: pendingMsgs });
                delete pending[from];
                localStorage.setItem('pending', JSON.stringify(pending));
            }
        }

        function handleSyncDeliver(from, payload) {
            if (payload.messages) {
                payload.messages.forEach(msg => {
                    receiveMessage(from, msg);
                });
            }
        }

        // ===== CHAT =====
        function sendMessage() {
            if (!currentChat) return;
            
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;
            
            const message = {
                id: Date.now(),
                type: 'text',
                content: text,
                time: new Date().toISOString(),
                from: myPin
            };
            
            sendMessageToContact(currentChat, message);
            input.value = '';
        }

        function setupFileInput() {
            document.getElementById('fileInput').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file || !currentChat) return;
                
                const reader = new FileReader();
                reader.onload = (event) => {
                    const message = {
                        id: Date.now(),
                        type: file.type.startsWith('image/') ? 'image' : 
                              file.type.startsWith('video/') ? 'video' : 'file',
                        content: event.target.result,
                        fileName: file.name,
                        fileType: file.type,
                        time: new Date().toISOString(),
                        from: myPin
                    };
                    
                    sendMessageToContact(currentChat, message);
                };
                reader.readAsDataURL(file);
                
                // Reset input
                e.target.value = '';
            });
        }

        async function toggleVoiceRecording() {
            if (!currentChat) return;
            
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    
                    mediaRecorder.ondataavailable = (e) => {
                        audioChunks.push(e.data);
                    };
                    
                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.onload = (event) => {
                            const message = {
                                id: Date.now(),
                                type: 'audio',
                                content: event.target.result,
                                time: new Date().toISOString(),
                                from: myPin
                            };
                            
                            sendMessageToContact(currentChat, message);
                        };
                        reader.readAsDataURL(audioBlob);
                        
                        // Stop all tracks
                        stream.getTracks().forEach(track => track.stop());
                    };
                    
                    mediaRecorder.start();
                    isRecording = true;
                    document.getElementById('voiceBtn').classList.add('recording');
                    toast('Recording...');
                    
                } catch (err) {
                    toast('Microphone permission needed');
                }
            } else {
                if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                    mediaRecorder.stop();
                    isRecording = false;
                    document.getElementById('voiceBtn').classList.remove('recording');
                }
            }
        }

        function sendMessageToContact(contact, message) {
            // Save to local
            if (!chats[contact]) chats[contact] = [];
            chats[contact].push({ ...message, direction: 'outgoing', status: 'sending' });
            localStorage.setItem('chats', JSON.stringify(chats));
            
            // Try to send
            if (onlineStatus[contact]?.online) {
                signal(contact, 'chat', message);
                updateMessageStatus(contact, message.id, 'sent');
            } else {
                if (!pending[contact]) pending[contact] = [];
                pending[contact].push(message);
                localStorage.setItem('pending', JSON.stringify(pending));
                updateMessageStatus(contact, message.id, 'pending');
            }
            
            renderChatMessages();
            renderChats();
        }

        function receiveMessage(from, message) {
            if (!chats[from]) chats[from] = [];
            chats[from].push({ ...message, direction: 'incoming', status: 'delivered' });
            localStorage.setItem('chats', JSON.stringify(chats));
            
            if (currentChat === from) {
                renderChatMessages();
            }
            
            renderChats();
            
            // Show notification
            if (document.hidden) {
                toast(`New message from ${from}`);
            }
        }

        function updateMessageStatus(contact, messageId, status) {
            const chat = chats[contact];
            if (chat) {
                const msg = chat.find(m => m.id === messageId);
                if (msg) {
                    msg.status = status;
                    localStorage.setItem('chats', JSON.stringify(chats));
                }
            }
        }

        // ===== CALLS =====
        async function startCall(type) {
            if (!currentChat) return;
            
            if (!onlineStatus[currentChat]?.online) {
                toast(`${currentChat} is offline`);
                
                calls.unshift({
                    with: currentChat,
                    type,
                    direction: 'outgoing',
                    status: 'missed',
                    time: new Date().toISOString()
                });
                localStorage.setItem('calls', JSON.stringify(calls));
                renderCalls();
                return;
            }
            
            try {
                localStream = await navigator.mediaDevices.getUserMedia({
                    audio: true,
                    video: type === 'video'
                });
                
                document.getElementById('localVideo').srcObject = localStream;
                document.getElementById('callScreen').classList.add('show');
                document.getElementById('callStatusText').textContent = 'Calling...';
                document.getElementById('callSubtext').textContent = currentChat;
                
                isCallActive = true;
                
                const pc = new RTCPeerConnection({
                    iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
                });
                
                peerConnections[currentChat] = pc;
                
                pc.onicecandidate = (e) => {
                    if (e.candidate) {
                        signal(currentChat, 'ice_candidate', { candidate: e.candidate });
                    }
                };
                
                pc.ontrack = (e) => {
                    document.getElementById('remoteVideo').srcObject = e.streams[0];
                    document.getElementById('callStatusText').textContent = 'Connected';
                    document.getElementById('callSubtext').textContent = '';
                    clearTimeout(callTimeout);
                };
                
                localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
                
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);
                
                signal(currentChat, 'call_offer', {
                    sdp: pc.localDescription,
                    type
                });
                
                // Call timeout - 45 seconds
                callTimeout = setTimeout(() => {
                    if (isCallActive && document.getElementById('callStatusText').textContent !== 'Connected') {
                        document.getElementById('callStatusText').textContent = 'No Answer';
                        document.getElementById('callSubtext').textContent = 'User did not respond';
                        
                        calls.unshift({
                            with: currentChat,
                            type,
                            direction: 'outgoing',
                            status: 'no-answer',
                            time: new Date().toISOString()
                        });
                        localStorage.setItem('calls', JSON.stringify(calls));
                        renderCalls();
                        
                        setTimeout(() => endCall(), 2000);
                    }
                }, 45000);
                
            } catch (err) {
                toast('Camera/mic error: ' + err.message);
                endCall();
            }
        }

        function handleCallOffer(from, payload) {
            if (!isCallActive) {
                if (confirm(`Incoming ${payload.type} call from ${from}. Answer?`)) {
                    answerCall(from, payload);
                } else {
                    signal(from, 'call_end', {});
                }
            }
        }

        async function answerCall(from, payload) {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({
                    audio: true,
                    video: payload.type === 'video'
                });
                
                document.getElementById('localVideo').srcObject = localStream;
                document.getElementById('callScreen').classList.add('show');
                document.getElementById('callStatusText').textContent = 'Connecting...';
                
                isCallActive = true;
                currentChat = from;
                
                const pc = new RTCPeerConnection({
                    iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
                });
                
                peerConnections[from] = pc;
                
                pc.onicecandidate = (e) => {
                    if (e.candidate) {
                        signal(from, 'ice_candidate', { candidate: e.candidate });
                    }
                };
                
                pc.ontrack = (e) => {
                    document.getElementById('remoteVideo').srcObject = e.streams[0];
                    document.getElementById('callStatusText').textContent = 'Connected';
                    document.getElementById('callSubtext').textContent = '';
                };
                
                localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
                
                await pc.setRemoteDescription(new RTCSessionDescription(payload.sdp));
                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);
                
                signal(from, 'call_answer', { sdp: pc.localDescription });
                
            } catch (err) {
                toast('Call error: ' + err.message);
                endCall();
            }
        }

        function handleCallAnswer(from, payload) {
            const pc = peerConnections[from];
            if (pc) {
                pc.setRemoteDescription(new RTCSessionDescription(payload.sdp));
            }
        }

        function handleIceCandidate(from, payload) {
            const pc = peerConnections[from];
            if (pc) {
                pc.addIceCandidate(new RTCIceCandidate(payload.candidate));
            }
        }

        function handleCallEnd(from) {
            if (currentChat === from) {
                toast('Call ended by other user');
                endCall();
            }
        }

        function endCall() {
            document.getElementById('callScreen').classList.remove('show');
            
            if (callTimeout) {
                clearTimeout(callTimeout);
                callTimeout = null;
            }
            
            if (localStream) {
                localStream.getTracks().forEach(t => t.stop());
                localStream = null;
            }
            
            Object.values(peerConnections).forEach(pc => pc.close());
            peerConnections = {};
            isCallActive = false;
        }

        function toggleMute() {
            if (localStream) {
                const audioTrack = localStream.getAudioTracks()[0];
                if (audioTrack) {
                    audioTrack.enabled = !audioTrack.enabled;
                }
            }
        }

        function toggleSpeaker() {
            // Implement speaker toggle if needed
        }

        // ===== UI RENDERING =====
        function renderContacts() {
            const list = document.getElementById('contactsList');
            const empty = document.getElementById('contactsEmpty');
            
            if (!contacts.length) {
                list.innerHTML = '';
                empty.style.display = 'block';
                return;
            }
            
            empty.style.display = 'none';
            list.innerHTML = contacts.map(c => `
                <div class="item" onclick="openChat('${c.pin}', '${c.name || c.pin}')">
                    <div class="item-avatar">${c.pin[0]}</div>
                    <div class="item-info">
                        <div class="item-name">${c.name || c.pin}</div>
                        <div class="item-detail">PIN: ${c.pin}</div>
                    </div>
                    <div class="status-dot ${onlineStatus[c.pin]?.online ? 'online' : ''}"></div>
                </div>
            `).join('');
        }

        function renderChats() {
            const list = document.getElementById('chatsList');
            const empty = document.getElementById('chatsEmpty');
            
            const chatPins = Object.keys(chats);
            if (!chatPins.length) {
                list.innerHTML = '';
                empty.style.display = 'block';
                return;
            }
            
            empty.style.display = 'none';
            list.innerHTML = chatPins.map(pin => {
                const lastMsg = chats[pin][chats[pin].length - 1];
                const contact = contacts.find(c => c.pin === pin) || { name: pin };
                const pendingCount = pending[pin]?.length || 0;
                
                return `
                    <div class="item" onclick="openChat('${pin}', '${contact.name}')">
                        <div class="item-avatar">${pin[0]}</div>
                        <div class="item-info">
                            <div class="item-name">${contact.name}</div>
                            <div class="item-detail">
                                ${lastMsg.type === 'text' ? lastMsg.content.substring(0, 30) : 
                                  lastMsg.type === 'image' ? '📷 Image' :
                                  lastMsg.type === 'video' ? '🎥 Video' :
                                  lastMsg.type === 'audio' ? '🎤 Voice note' : '📎 File'}
                                ${lastMsg.content.length > 30 ? '...' : ''}
                            </div>
                        </div>
                        <div class="item-right">
                            <div class="item-time">${new Date(lastMsg.time).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</div>
                            ${pendingCount ? '<div class="badge">!</div>' : ''}
                        </div>
                        <div class="status-dot ${onlineStatus[pin]?.online ? 'online' : ''}"></div>
                    </div>
                `;
            }).join('');
        }

        function renderCalls() {
            const list = document.getElementById('callsList');
            const empty = document.getElementById('callsEmpty');
            
            if (!calls.length) {
                list.innerHTML = '';
                empty.style.display = 'block';
                return;
            }
            
            empty.style.display = 'none';
            list.innerHTML = calls.map(call => {
                const contact = contacts.find(c => c.pin === call.with) || { name: call.with };
                return `
                    <div class="item" onclick="openChat('${call.with}', '${contact.name}')">
                        <div style="width: 40px; height: 40px; background: var(--surface2); border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="${call.status === 'missed' ? 'var(--accent)' : 'var(--text-muted)'}">
                                <path d="M20 15.5c-1.2 0-2.4-.2-3.6-.6-.3-.1-.7 0-1 .2l-2.2 2.2c-2.8-1.4-5.1-3.8-6.6-6.6l2.2-2.2c.3-.3.4-.7.2-1-.3-1.1-.5-2.3-.5-3.5 0-.6-.4-1-1-1H4c-.6 0-1 .4-1 1 0 9.4 7.6 17 17 17 .6 0 1-.4 1-1v-3.5c0-.6-.4-1-1-1z"/>
                            </svg>
                        </div>
                        <div class="item-info">
                            <div class="item-name">${contact.name}</div>
                            <div class="item-detail">
                                ${call.direction === 'outgoing' ? 'Outgoing' : 'Incoming'} · 
                                ${call.type} · 
                                ${call.status === 'missed' ? 'Missed' : 
                                  call.status === 'no-answer' ? 'No answer' : 
                                  call.status === 'completed' ? `${Math.floor(call.duration/60)}:${(call.duration%60).toString().padStart(2,'0')}` : ''}
                            </div>
                        </div>
                        <div class="item-time">${new Date(call.time).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</div>
                    </div>
                `;
            }).join('');
        }

        function renderChatMessages() {
            const container = document.getElementById('chatMessages');
            if (!currentChat || !chats[currentChat]) {
                container.innerHTML = '';
                return;
            }
            
            container.innerHTML = chats[currentChat].map(msg => {
                let contentHtml = '';
                
                if (msg.type === 'text') {
                    contentHtml = `<div class="message-bubble">${msg.content}</div>`;
                } else if (msg.type === 'image') {
                    contentHtml = `<img src="${msg.content}" class="message-media" onclick="window.open('${msg.content}')">`;
                } else if (msg.type === 'video') {
                    contentHtml = `<video src="${msg.content}" class="message-media" controls></video>`;
                } else if (msg.type === 'audio') {
                    contentHtml = `<audio src="${msg.content}" class="message-audio" controls></audio>`;
                } else {
                    contentHtml = `<div class="message-bubble">📎 ${msg.fileName || 'File'}</div>`;
                }
                
                return `
                    <div class="message ${msg.direction === 'outgoing' ? 'own' : ''}">
                        ${contentHtml}
                        <div class="message-meta">
                            ${new Date(msg.time).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}
                            ${msg.direction === 'outgoing' && msg.status === 'pending' ? 
                              '<span class="message-status pending">⏳</span>' : 
                              msg.direction === 'outgoing' && msg.status === 'sent' ? ' ✓' : ''}
                        </div>
                    </div>
                `;
            }).join('');
            
            container.scrollTop = container.scrollHeight;
        }

        // ===== UI ACTIONS =====
        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            
            event.target.closest('.tab').classList.add('active');
            document.getElementById(tab + 'View').classList.add('active');
        }

        function showAddContactModal() {
            document.getElementById('addContactModal').classList.add('show');
        }

        function hideModal() {
            document.getElementById('addContactModal').classList.remove('show');
            document.getElementById('contactPin').value = '';
        }

        function addContact() {
            const pin = document.getElementById('contactPin').value;
            if (pin.length !== 6) {
                toast('Enter a valid 6-digit PIN');
                return;
            }
            
            if (contacts.find(c => c.pin === pin)) {
                toast('Contact already exists');
                hideModal();
                return;
            }
            
            const name = prompt('Enter a name for this contact (optional)');
            contacts.push({ pin, name: name || pin, added: new Date().toISOString() });
            localStorage.setItem('contacts', JSON.stringify(contacts));
            
            renderContacts();
            hideModal();
            toast('Contact added');
        }

        function openChat(pin, name) {
            currentChat = pin;
            document.getElementById('chatContactName').textContent = name;
            document.getElementById('chatContactStatus').textContent = onlineStatus[pin]?.online ? 'Online' : 'Offline';
            document.getElementById('chatView').classList.add('show');
            renderChatMessages();
        }

        function closeChat() {
            document.getElementById('chatView').classList.remove('show');
            currentChat = null;
        }

        function toast(msg) {
            const el = document.createElement('div');
            el.className = 'toast';
            el.textContent = msg;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 2800);
        }

        // ===== EXPOSE GLOBALLY =====
        window.switchTab = switchTab;
        window.showAddContactModal = showAddContactModal;
        window.hideModal = hideModal;
        window.addContact = addContact;
        window.openChat = openChat;
        window.closeChat = closeChat;
        window.sendMessage = sendMessage;
        window.startCall = startCall;
        window.endCall = endCall;
        window.toggleMute = toggleMute;
        window.toggleSpeaker = toggleSpeaker;
        window.signup = signup;
        window.installApp = installApp;
        window.toggleVoiceRecording = toggleVoiceRecording;
    </script>
</body>
    </html>
